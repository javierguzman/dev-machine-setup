# Terminal look for Ghostty and iTerm2. The values copy the Alacritty config in
# ~/.dotfiles/alacritty/.config/alacritty/alacritty.toml.
# tasks/terminal.yml renders templates/ghostty/* and templates/iterm2/* from these values.

terminal_font:
  family: "FiraCode Nerd Font"
  size: 14
  # PostScript names (iTerm2 needs them)
  postscript:
    regular: FiraCodeNF-Reg
    bold: FiraCodeNF-Bold
    italic: FiraCodeNF-Light
    bold_italic: FiraCodeNF-SemBd
  # Ghostty style names (same as the Alacritty `style` values)
  styles:
    regular: Regular
    bold: Bold
    italic: Light
    bold_italic: SemiBold
  # Alacritty does not draw ligatures. Ghostty and iTerm2 draw them.
  ligatures: true

terminal_padding: 8          # pixels, both directions
terminal_opacity: 0.95
terminal_cursor_blink: true  # block cursor

# Theme for both terminals: tokyo-night-dark | tokyo-night-light
# Ghostty also accepts "light:tokyo-night-light,dark:tokyo-night-dark" to follow
# the macOS appearance. iTerm2 uses the dark/light pair when the value has a comma.
terminal_theme: tokyo-night-dark

# Fixed so that iTerm2 updates the profile instead of adding a new one.
iterm2_profile_guid: "6F3B4C2E-8A1D-4E7B-9C5F-2D0A1B3C4E5F"
iterm2_profile_name: "Alacritty"

