# Zsh, Oh-My-Zsh, Powerlevel10k (minimal)
# macOS ships zsh as /bin/zsh, so the playbook does not install it there.

- name: Zsh package
  ansible.builtin.include_tasks: lib/packages.yml
  vars:
    packages:
      - { profile: minimal, apt: zsh }

- name: Set the default shell to zsh
  become: true
  ansible.builtin.user:
    name: "{{ ansible_facts['user_id'] }}"
    shell: "{{ '/bin/zsh' if is_macos else '/usr/bin/zsh' }}"
  ignore_errors: true
  when: not (ansible_facts['user_shell'] | default('') is search('zsh$'))

- name: Clone Oh-My-Zsh, theme, and plugins
  ansible.builtin.git:
    repo: "{{ item.repo }}"
    dest: "{{ ansible_facts['user_dir'] }}/{{ item.dest }}"
    version: master
    depth: 1
  loop:
    - { repo: "https://github.com/ohmyzsh/ohmyzsh.git", dest: ".oh-my-zsh" }
    - { repo: "https://github.com/romkatv/powerlevel10k.git", dest: ".oh-my-zsh/custom/themes/powerlevel10k" }
    - { repo: "https://github.com/zsh-users/zsh-autosuggestions.git", dest: ".oh-my-zsh/custom/plugins/zsh-autosuggestions" }
  loop_control:
    label: "{{ item.dest }}"
  ignore_errors: true
