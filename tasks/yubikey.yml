# YubiKey, GPG, and SSH (minimal: Git commit signing needs it)

- name: YubiKey and GPG packages
  ansible.builtin.include_tasks: lib/packages.yml
  vars:
    packages:
      # macOS. Homebrew gnupg + pinentry-mac replace GPG Suite: GPG Suite has
      # had no release since 2023, and its .pkg installer needs sudo.
      - { profile: minimal, brew: gnupg }
      - { profile: minimal, brew: pinentry-mac }
      - { profile: minimal, brew: yubico-piv-tool }
      - { profile: minimal, brew: ykman }
      - { profile: minimal, brew: libfido2 }
      - { profile: minimal, brew: openssh }   # the macOS ssh has no FIDO2 support
      # GUI for the YubiKey (OATH codes, PIV, FIDO). Replaces the discontinued YubiKey Manager app.
      - { profile: minimal, cask: yubico-authenticator }
      # Linux
      - profile: minimal
        apt:
          - gnupg
          - scdaemon
          - pcscd
          - pcsc-tools
          - pinentry-curses
          - pinentry-gnome3
          - yubikey-manager
          - yubico-piv-tool
          - ykcs11            # provides libykcs11.so
          - libfido2-1

- name: Enable pcscd service (Linux)
  become: true
  ansible.builtin.systemd_service:
    name: pcscd
    enabled: true
    state: started
  ignore_errors: true
  when: is_linux

# ─── GPG config ───────────────────────────────────────────────────────────────

- name: Ensure ~/.gnupg exists
  ansible.builtin.file:
    path: "{{ ansible_facts['user_dir'] }}/.gnupg"
    state: directory
    mode: "0700"

- name: Write GPG config files
  ansible.builtin.copy:
    dest: "{{ ansible_facts['user_dir'] }}/.gnupg/{{ item.file }}"
    content: "{{ item.content }}"
    mode: "0600"
  loop:
    - file: gpg-agent.conf
      content: |
        default-cache-ttl 600
        max-cache-ttl 7200
        {% if is_macos %}
        pinentry-program {{ brew_prefix }}/bin/pinentry-mac
        {% endif %}
    - file: gpg.conf
      content: |
        auto-key-retrieve
    - file: dirmngr.conf
      content: |
        keyserver hkps://keys.openpgp.org
  loop_control:
    label: "{{ item.file }}"

# ─── SSH ──────────────────────────────────────────────────────────────────────

- name: Ensure ~/.ssh exists
  ansible.builtin.file:
    path: "{{ ansible_facts['user_dir'] }}/.ssh"
    state: directory
    mode: "0700"

- name: Link the PKCS#11 provider library
  ansible.builtin.file:
    src: "{{ (brew_prefix ~ '/lib/libykcs11.dylib') if is_macos else (linux_lib_dir ~ '/libykcs11.so') }}"
    dest: "{{ ansible_facts['user_dir'] }}/.ssh/pkcs11-provider"
    state: link
    force: true

- name: Deploy SSH config (vault-encrypted)
  when: ssh_config_deploy | bool
  block:
    - name: Deploy SSH config
      ansible.builtin.copy:
        src: ssh_config
        dest: "{{ ansible_facts['user_dir'] }}/.ssh/config"
        mode: "0600"
        backup: true
  rescue:
    - name: Record SSH config failure
      ansible.builtin.set_fact:
        install_failures: >-
          {{ install_failures + ['ssh_config: could not decrypt or copy. Run with --ask-vault-pass,
          or set ssh_config_deploy=false.'] }}

- name: Print YubiKey setup reminder
  ansible.builtin.debug:
    msg:
      - "YubiKey manual steps (see README):"
      - "1. Insert the YubiKey"
      - "2. gpg --recv-keys {{ git_signing_key }}  (or gpg --import your-public-key.asc)"
      - "3. gpg --edit-key {{ git_signing_key }} -> trust -> 5 -> quit"
      - "4. gpg --card-status"
      - "5. ssh-add -L"
