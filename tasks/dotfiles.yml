# Dotfiles (minimal). yabai/skhd configs on macOS, hypr (Hyprland) on Linux.

- name: Check for the dotfiles repository
  ansible.builtin.stat:
    path: "{{ dotfiles_dir }}/.git"
  register: _dotfiles_git

# SSH works only after the YubiKey setup. GitHub answers "successfully
# authenticated" (with exit code 1) when it accepts the key.
- name: Check SSH access to GitHub
  ansible.builtin.command:
    argv: [ssh, -T, -o, BatchMode=yes, -o, ConnectTimeout=5, -o, StrictHostKeyChecking=accept-new, git@github.com]
  register: _github_ssh
  changed_when: false
  failed_when: false
  check_mode: false
  when: not _dotfiles_git.stat.exists

# Clone only when the folder is missing. An existing clone keeps its remote
# and its local changes. An HTTPS clone still pushes over SSH (see tasks/git.yml).
- name: Clone dotfiles
  ansible.builtin.git:
    repo: "{{ dotfiles_repo_ssh if 'successfully authenticated' in (_github_ssh.stderr | default('')) else dotfiles_repo }}"
    dest: "{{ dotfiles_dir }}"
    version: main
    recursive: true
  when: not _dotfiles_git.stat.exists

- name: List the packages in the dotfiles repository
  ansible.builtin.find:
    paths: "{{ dotfiles_dir }}"
    file_type: directory
    recurse: false
  register: _dotfiles_dirs

# A package that is not in the clone yet (for example, not pushed) is listed
# in the summary instead of a stow error.
- name: Select dotfiles packages (profile, system, skip_apps)
  ansible.builtin.set_fact:
    _stow_packages: "{{ _wanted | select('in', _existing) | list }}"
    install_failures: >-
      {{ install_failures + (_wanted | reject('in', _existing)
         | map('regex_replace', '^(.*)$', 'dotfiles: package \1 is not in ' ~ dotfiles_dir ~ ' (commit and push it?)') | list) }}
  vars:
    _os: "{{ 'macos' if is_macos else 'linux' }}"
    _existing: "{{ _dotfiles_dirs.files | map(attribute='path') | map('basename') | list }}"
    _wanted: >-
      {%- set out = [] -%}
      {%- for p in dotfiles_packages -%}
        {%- if p.profile in active_profiles
              and (p.os | default(_os)) == _os
              and (p.app | default(p.name)) not in skip_app_list -%}
          {%- set _ = out.append(p.name) -%}
        {%- endif -%}
      {%- endfor -%}
      {{ out }}

- name: Move files that block stow to {{ dotfiles_backup_dir }}
  ansible.builtin.command:
    argv: "{{ [ansible_playbook_python, playbook_dir ~ '/scripts/stow_backup.py',
               '--dotfiles', dotfiles_dir,
               '--target', ansible_facts['user_dir'],
               '--backup', dotfiles_backup_dir ~ '/' ~ ansible_facts['date_time']['iso8601_basic_short']]
              + _stow_packages }}"
  register: _stow_backup
  changed_when: "'MOVED' in _stow_backup.stdout"

# --no-folding links single files, not whole folders. Without it, stow links
# ~/.local to the repo, and installers then write into the dotfiles repo.
- name: Stow dotfiles
  ansible.builtin.command:
    argv:
      - stow
      - --verbose
      - --no-folding
      - --dir={{ dotfiles_dir }}
      - --target={{ ansible_facts['user_dir'] }}
      - "{{ item }}"
  loop: "{{ _stow_packages }}"
  register: _stow
  changed_when: "'LINK' in _stow.stderr"
  ignore_errors: true
  environment: "{{ brew_environment if is_macos else {} }}"
