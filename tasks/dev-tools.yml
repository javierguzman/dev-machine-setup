# macOS
- name: Install dev tools (macOS)
  community.general.homebrew_cask:
    name:
      - visual-studio-code
      - yaak
      - google-chrome
      - docker
      - vmware-fusion
      - lm-studio
    state: present
  when: ansible_os_family == "Darwin"

# Linux
- name: Add VSCode apt repository (Linux)
  become: true
  shell: |
    wget -qO- https://packages.microsoft.com/keys/microsoft.asc | gpg --dearmor > /usr/share/keyrings/microsoft.gpg
    echo "deb [arch=amd64 signed-by=/usr/share/keyrings/microsoft.gpg] https://packages.microsoft.com/repos/code stable main" > /etc/apt/sources.list.d/vscode.list
    apt update
  args:
    creates: /etc/apt/sources.list.d/vscode.list
  when: ansible_os_family == "Debian"

- name: Install VSCode (Linux)
  become: true
  apt:
    name: code
    state: present
  when: ansible_os_family == "Debian"


- name: Install Google Chrome (Linux)
  become: true
  shell: |
    wget -q https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb -O /tmp/chrome.deb
    apt install -y /tmp/chrome.deb
  args:
    creates: /usr/bin/google-chrome
  when: ansible_os_family == "Debian"

- name: Install Docker (Linux)
  become: true
  apt:
    name:
      - docker.io
      - docker-compose-v2
    state: present
  when: ansible_os_family == "Debian"

- name: Enable docker service (Linux)
  become: true
  systemd:
    name: docker
    enabled: yes
    state: started
  when: ansible_os_family == "Debian"

- name: Add user to docker group (Linux)
  become: true
  user:
    name: "{{ ansible_env.USER }}"
    groups: docker
    append: yes
  when: ansible_os_family == "Debian"

# Cross-platform
- name: Install Claude Code CLI
  ansible.builtin.shell: curl -fsSL https://claude.ai/install.sh | bash
  args:
    creates: "{{ ansible_user_dir }}/.local/bin/claude"
