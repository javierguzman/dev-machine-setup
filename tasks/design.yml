# Design and diagram tools (Figma and draw.io for work, photo editing personal)

- name: Design apps
  ansible.builtin.include_tasks: lib/packages.yml
  vars:
    packages:
      - { profile: work, cask: figma }
      - { profile: work, cask: drawio, snap: drawio }
      - { profile: personal, cask: gimp, apt: gimp }
      # Affinity Photo 2 and Designer 2 are discontinued. `affinity` is the new single app.
      - { profile: personal, cask: affinity }
      # The darktable cask is disabled (it fails the Gatekeeper check).
      # macOS: download it from https://www.darktable.org/install/
      - { profile: personal, apt: darktable }
