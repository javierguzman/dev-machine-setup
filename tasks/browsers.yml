# Web browsers (work)

- name: Browsers
  ansible.builtin.include_tasks: lib/packages.yml
  vars:
    packages:
      - { profile: work, cask: google-chrome }   # Linux: .deb below
      - { profile: work, cask: firefox, apt: firefox }
      - { profile: work, cask: brave-browser }   # Linux: apt repo below

# ─── Linux ────────────────────────────────────────────────────────────────────

- name: Install Google Chrome (Linux)
  become: true
  ansible.builtin.shell: |
    set -euo pipefail
    wget -qO /tmp/chrome.deb https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
    apt-get install -y /tmp/chrome.deb
  args:
    executable: /bin/bash
    creates: /usr/bin/google-chrome
  ignore_errors: true
  when: is_linux and not is_arm and 'google-chrome' in _selected_ids

- name: Add Brave apt repository (Linux)
  become: true
  ansible.builtin.shell: |
    set -euo pipefail
    curl -fsSLo /usr/share/keyrings/brave-browser-archive-keyring.gpg https://brave-browser-apt-release.s3.brave.com/brave-browser-archive-keyring.gpg
    echo "deb [signed-by=/usr/share/keyrings/brave-browser-archive-keyring.gpg] https://brave-browser-apt-release.s3.brave.com/ stable main" > /etc/apt/sources.list.d/brave-browser-release.list
    apt-get update
  args:
    executable: /bin/bash
    creates: /etc/apt/sources.list.d/brave-browser-release.list
  ignore_errors: true
  when: is_linux and 'brave-browser' in _selected_ids

- name: Install Brave (Linux)
  become: true
  ansible.builtin.apt:
    name: brave-browser
    state: present
  ignore_errors: true
  when: is_linux and 'brave-browser' in _selected_ids
